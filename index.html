<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Teacher MM - ကျောင်းတေးသီချင်းများနှင့် ကိရိယာများ</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;padding:16px;background:#f4f4f9;color:#333;margin:0;max-width:860px;margin:auto;line-height:1.6}
h1{font-size:clamp(22px,5vw,30px);text-align:center;color:#2c3e50;margin:18px 0 8px}
section{background:#fff;padding:16px;margin-bottom:16px;border-radius:12px;box-shadow:0 2px 8px #00000012}
h2{color:#2c3e50;font-size:17px;border-bottom:2px solid #3498db;padding-bottom:5px}
label{display:block;margin-top:8px}
input,select,button{padding:10px;margin:5px 0;width:100%;min-height:44px;border:1px solid #ccd1d1;border-radius:8px;font-size:16px}
button{background:#3498db;color:white;border:0;cursor:pointer;font-weight:bold}
button:hover{background:#2980b9}
.song-list{display:flex;flex-direction:column;gap:6px;max-height:280px;overflow-y:auto;margin-top:8px}
.song-btn{background:#ecf0f1;color:#2c3e50;border:1px solid #bdc3c7;padding:8px 10px;text-align:left;border-radius:7px;font-size:14px;min-height:42px}
.song-btn:hover{background:#3498db;color:white}
audio{width:100%;margin-top:10px}
.result-box{font-weight:bold;margin-top:8px;padding:10px;background:#e8f8f5;border-radius:8px;color:#216e5a;line-height:1.8;overflow-wrap:anywhere;white-space:pre-line}
button:focus-visible,input:focus-visible{outline:3px solid #f1c40f;outline-offset:2px}
@media(max-width:480px){body{padding:10px}section{padding:13px}.song-list{max-height:240px}}
</style>
</head>
<body>
<h1>Smart Teacher MM</h1>
<p style="text-align:center;color:#666;font-size:13px;margin-top:-5px">ပညာအလင်းအိမ် - သင်ထောက်ကူ အက်ပ်</p>

<section>
<h2>🎵 ကျောင်းတေးသီချင်းများ (နာမည်နှိပ်၍ အသံနားဆင်ရန်)</h2>
<p style="font-size:12px;color:#e67e22">* သီချင်းနာမည်ကို နှိပ်ပြီး အသံနားဆင်နိုင်ပါသည်။</p>
<div class="song-list">
<button class="song-btn" onclick="playSong('01.mp3','National Song')">1. National_Song.mp3</button>
<button class="song-btn" onclick="playSong('02.mp3','National School (Karaoke)')">2. National_School(Karaoke).mp3</button>
<button class="song-btn" onclick="playSong('03.mp3','Myanmar School (Myanmar)')">3. Myanmar_School(Myanmar).mp3</button>
<button class="song-btn" onclick="playSong('04.mp3','Myanmar Student Song (English Version)')">4. Myanmar_Student_Song_English_Version.mp3</button>
<button class="song-btn" onclick="playSong('05.mp3','School Council')">5. School_Council.mp3</button>
<button class="song-btn" onclick="playSong('06.mp3','School Council (Karaoke)')">6. School_Council_Karaoke.mp3</button>
<button class="song-btn" onclick="playSong('07.mp3','Pyi Myanmar')">7. Pyi_Myanmar.mp3</button>
<button class="song-btn" onclick="playSong('08.mp3','Zar Ti Man')">8. Zar_Ti_Man.mp3</button>
<button class="song-btn" onclick="playSong('09.mp3','Zar Ti Man (Karaoke)')">9. Zar_Ti_Man_Karaoke.mp3</button>
<button class="song-btn" onclick="playSong('10.mp3','Bat Sone Pyinnya Ko Yi')">10. Bat_Sone_Pyinnya_Ko_Yi.mp3</button>
<button class="song-btn" onclick="playSong('11.mp3','Bat Sone Pyinnya Ko Yi (Karaoke)')">11. Bat_Sone_Pyinnya_Ko_Yi(Karaoke).mp3</button>
<button class="song-btn" onclick="playSong('12.mp3','Beautiful Gardeners')">12. Beautiful_Gardeners.mp3</button>
<button class="song-btn" onclick="playSong('13.mp3','Goodbye')">13. Goodbye.mp3</button>
<button class="song-btn" onclick="playSong('14.mp3','Kaba Asinthmi Pyinnya Yi')">14. Kaba_Asinthmi_Pyinnya_Yi.mp3</button>
<button class="song-btn" onclick="playSong('15.mp3','Khayi Hpaw Toe Lan Khwe Chain')">15. Khayi_Hpaw_Toe_Lan_Khwe_Chain.mp3</button>
<button class="song-btn" onclick="playSong('16.mp3','Kyo So Par Thi Sone Nyi Pwe Taw')">16. Kyo_So_Par_Thi_Sone_Nyi_Pwe_Taw.mp3</button>
<button class="song-btn" onclick="playSong('17.mp3','Myat Sayar')">17. Myat_Sayar.mp3</button>
<button class="song-btn" onclick="playSong('18.mp3','Myit Ayeyar')">18. Myit_Ayeyar.mp3</button>
<button class="song-btn" onclick="playSong('19.mp3','Our School our environment')">19. Our_School_our_enveroment.mp3</button>
<button class="song-btn" onclick="playSong('20.mp3','Our School (Toe Kyaung Taw)')">20. Our_School(Toe_Kyaung_Taw).mp3</button>
<button class="song-btn" onclick="playSong('21.mp3','PE (Moe Lone Hmaing)')">21. PE(Moe_Lone_Hmaing).mp3</button>
<button class="song-btn" onclick="playSong('22.mp3','Pyidaungsu Khayithe')">22. Pyidaungsu_Khayithe.mp3</button>
<button class="song-btn" onclick="playSong('23.mp3','Sayar Yae Gayunar')">23. Sayar_Yae_Gayunar.mp3</button>
<button class="song-btn" onclick="playSong('24.mp3','Sone Ma Sar')">24. Sone_Ma_Sar.mp3</button>
<button class="song-btn" onclick="playSong('25.mp3','Taung Gyi Hpawar autt')">25. Taung_Gyi_Hpawar_autt.mp3</button>
<button class="song-btn" onclick="playSong('26.mp3','White and Green')">26. White and Green.mp3</button>
<button class="song-btn" onclick="playSong('27.mp3','Additional Song')">27.mp3</button>
</div>
<div style="margin-top:12px;background:#eaf2f8;padding:10px;border-radius:8px">
<p id="nowPlaying" style="font-weight:bold;font-size:13px;color:#2980b9;margin:0 0 5px">ရွေးချယ်ထားခြင်း မရှိသေးပါ</p>
<audio id="audioPlayer" controls style="display:none"></audio>
</div>
</section>

<section>
<h2>⏳ အသက်တွက်ချက်ရန်</h2>
<label for="birthYear">မွေးသက္ကရာဇ် (ဥပမာ - 2015):</label>
<input type="number" id="birthYear" inputmode="numeric" min="1900" placeholder="ခုနှစ်ထည့်ရန်">
<button onclick="calculateAge()">အသက်တွက်မည်</button>
<p id="ageResult" class="result-box" style="color:#c0392b;background:#fadbd8"></p>
</section>

<section>
<h2>📊 အမှတ်ပေါင်းနှင့် အဆင့်ခွဲရန်</h2>
<label for="mmy">မြန်မာစာ (၁၀၀ ဖိုး):</label><input type="number" id="mmy" min="0" max="100" step="0.5" placeholder="အမှတ်ထည့်ရန်">
<label for="math">သင်္ချာ (၁၀၀ ဖိုး):</label><input type="number" id="math" min="0" max="100" step="0.5" placeholder="အမှတ်ထည့်ရန်">
<label for="eng">အင်္ဂလိပ်စာ (၁၀၀ ဖိုး):</label><input type="number" id="eng" min="0" max="100" step="0.5" placeholder="အမှတ်ထည့်ရန်">
<label for="sci">သိပ္ပံ (၁၀၀ ဖိုး):</label><input type="number" id="sci" min="0" max="100" step="0.5" placeholder="အမှတ်ထည့်ရန်">
<label for="soc">လူမှုရေး/ပထဝီ (၁၀၀ ဖိုး):</label><input type="number" id="soc" min="0" max="100" step="0.5" placeholder="အမှတ်ထည့်ရန်">
<button onclick="calculateMarks()">အမှတ်ပေါင်းနှင့် အဆင့်တွက်မည်</button>
<div id="markResult" class="result-box"></div>
</section>

<script>
function playSong(fileName,title){
 const player=document.getElementById('audioPlayer');
 const nowPlaying=document.getElementById('nowPlaying');
 nowPlaying.textContent="ဖွင့်ရန် ကြိုးစားနေသည်: "+title;
 player.src=fileName;
 player.style.display="block";
 player.play().catch(()=>{
   nowPlaying.textContent="အသံဖိုင် ဖွင့်မရပါ။ အင်တာနက်နှင့် ဖိုင်လင့်ခ်ကို စစ်ဆေးပါ။";
 });
}
function calculateAge(){
 const input=document.getElementById('birthYear');
 const result=document.getElementById('ageResult');
 const birthYear=Number(input.value);
 const currentYear=new Date().getFullYear();
 if(!input.value.trim()||!Number.isInteger(birthYear)||birthYear<1900||birthYear>currentYear){
   result.textContent="မွေးဖွားသည့် ခုနှစ်ကို မှန်ကန်စွာ ထည့်ပါ။";
   return;
 }
 result.textContent="ယခုနှစ် "+currentYear+" အရ အသက်မှာ "+(currentYear-birthYear)+
 " နှစ်ခန့် ဖြစ်ပါသည်။ (မွေးနေ့ရောက်/မရောက်အပေါ် မူတည်၍ ကွာနိုင်ပါသည်။)";
}
function calculateMarks(){
 const ids=['mmy','math','eng','sci','soc'];
 const labels=['မြန်မာစာ','သင်္ချာ','အင်္ဂလိပ်စာ','သိပ္ပံ','လူမှုရေး/ပထဝီ'];
 const marks=[];
 for(let i=0;i<ids.length;i++){
   const input=document.getElementById(ids[i]);
   const raw=input.value.trim();
   const mark=Number(raw);
   if(raw===''||!Number.isFinite(mark)||mark<0||mark>100){
     document.getElementById('markResult').textContent=labels[i]+" အမှတ်ကို ၀ မှ ၁၀၀ အတွင်း ထည့်ပါ။ ဘာသာရပ်အားလုံး ဖြည့်ပါ။";
     input.focus();
     return;
   }
   marks.push(mark);
 }
 const total=marks.reduce((sum,mark)=>sum+mark,0);
 const average=total/marks.length;
 const failed=marks.filter(mark=>mark<40).length;
 let status,grade;
 if(failed>0){status="ကျရှုံးပါသည် ("+failed+" ဘာသာ ကျ)";grade="F";}
 else if(total>=400){status="ထူးချွန်စွာ အောင်မြင်သည်";grade="A+ (ထူးချွန်)";}
 else if(total>=250){status="အောင်မြင်ပါသည်";grade="B (အောင်)";}
 else{status="စုစုပေါင်းအမှတ် မပြည့်သဖြင့် ကျရှုံးပါသည်";grade="F";}
 const result=document.getElementById('markResult');
 result.textContent="စုစုပေါင်းအမှတ်: "+total+" / 500 မှတ်\n"+
 "ပျမ်းမျှရာခိုင်နှုန်း: "+average.toFixed(1)+"%\n"+
 "အဆင့်: "+grade+"\nအခြေအနေ: "+status;
}
</script>
</body>
</html>
